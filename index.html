<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f172a"/>
<title>Fracture Surgical Indications</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;min-height:100vh}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:22px;font-weight:700;color:#22d3ee}
.hdr p{font-size:13px;color:#94a3b8;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:12px}
.card label{display:block;font-size:13px;color:#94a3b8;margin-bottom:8px;font-weight:500}
input[type=text],input[type=number],select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:#22d3ee}
select option{background:#1e293b}
.proto-badge{font-size:13px;margin-top:10px;min-height:20px}
.proto-adult{color:#60a5fa}
.proto-peds{color:#4ade80}
.btn{display:block;width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;margin-top:4px;transition:background 0.15s}
.btn-primary{background:#0891b2;color:#fff}
.btn-primary:hover{background:#0e7490}
.btn-primary:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.btn-back{background:#1e293b;color:#e2e8f0;border:1px solid #334155;margin-bottom:16px}
.btn-back:hover{background:#334155}

/* Result header bands by region */
.rhdr{border-radius:10px;padding:14px 16px;margin-bottom:12px;border:1px solid}
.rhdr.upper{background:rgba(30,64,175,0.25);border-color:#3b82f6}
.rhdr.lower{background:rgba(20,83,45,0.25);border-color:#22c55e}
.rhdr.hand{background:rgba(88,28,135,0.25);border-color:#a855f7}
.rhdr.foot{background:rgba(120,53,15,0.25);border-color:#f59e0b}
.rhdr.spine{background:rgba(127,29,29,0.25);border-color:#ef4444}
.rhdr h2{font-size:18px;font-weight:700;color:#f1f5f9}
.rhdr p{font-size:13px;color:#94a3b8;margin-top:3px}

.section{border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid}
.sec-red{background:rgba(127,29,29,0.2);border-color:#b91c1c}
.sec-yellow{background:rgba(120,53,15,0.2);border-color:#b45309}
.sec-green{background:rgba(20,83,45,0.2);border-color:#15803d}
.sec-neutral{background:#1e293b;border-color:#334155}
.sec-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-red .sec-title{color:#f87171}
.sec-yellow .sec-title{color:#fbbf24}
.sec-green .sec-title{color:#4ade80}
.sec-neutral .sec-title{color:#22d3ee}
.item{font-size:13px;color:#cbd5e1;padding:4px 0 4px 14px;border-left:2px solid #334155;margin-bottom:5px;line-height:1.5}
.sec-red .item{border-left-color:#b91c1c}
.sec-yellow .item{border-left-color:#b45309}
.sec-green .item{border-left-color:#15803d}
.evidence{font-size:12px;color:#94a3b8;font-style:italic;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;margin-bottom:10px}
.disclaimer{font-size:11px;color:#475569;text-align:center;margin-top:24px;line-height:1.6}
#result-view{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>🦴 Fracture Surgical Indications</h1>
    <p>AO Classification &bull; Evidence-Based &bull; Adult &amp; Paediatric</p>
  </div>

  <!-- FORM -->
  <div id="form-view">
    <div class="card">
      <label>Search fracture</label>
      <input type="text" id="search" placeholder="e.g. femoral neck, ankle, scaphoid…" oninput="filterFx()">
    </div>
    <div class="card">
      <label>Select fracture type</label>
      <select id="fx-select" onchange="onFxChange()">
        <option value="">Select…</option>
      </select>
    </div>
    <div class="card" id="age-card" style="display:none">
      <label>Patient age (years)</label>
      <input type="number" id="age" placeholder="Enter age" min="0" max="120" oninput="onAgeChange()">
      <div class="proto-badge" id="proto-badge"></div>
    </div>
    <button class="btn btn-primary" id="go-btn" disabled onclick="showResult()">Show Indications</button>
  </div>

  <!-- RESULT -->
  <div id="result-view">
    <button class="btn btn-back" onclick="showForm()">&#8592; New Assessment</button>
    <div id="result-content"></div>
    <div class="disclaimer">
      Based on Apley's System of Orthopaedics, AO/OTA Classification, Key Techniques in Orthopaedic Surgery<br>
      Clinical correlation required &bull; Not a substitute for surgical judgment
    </div>
  </div>
</div>

const REGION_CLASS = {upper:"upper",lower:"lower",hand:"hand",foot:"foot",spine:"spine"};
const REGION_LABEL = {upper:"Upper Limb",lower:"Lower Limb",hand:"Hand / Wrist",foot:"Foot",spine:"Spine"};
const REGION_ORDER = ["upper","lower","hand","foot","spine"];

let allKeys = Object.keys(DB);
let filtered = [...allKeys];

function filterFx(){
  const q = document.getElementById('search').value.toLowerCase();
  filtered = allKeys.filter(k => k.toLowerCase().includes(q) || (DB[k].ao||'').toLowerCase().includes(q));
  populateSelect();
}

function populateSelect(){
  const sel = document.getElementById('fx-select');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Select…</option>';
  const groups = {};
  filtered.forEach(k => {
    const r = DB[k].region;
    if(!groups[r]) groups[r] = [];
    groups[r].push(k);
  });
  REGION_ORDER.forEach(r => {
    if(!groups[r]) return;
    const grp = document.createElement('optgroup');
    grp.label = '── ' + REGION_LABEL[r] + ' ──';
    groups[r].forEach(k => {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = k + '  (AO ' + DB[k].ao + ')';
      if(k === cur) o.selected = true;
      grp.appendChild(o);
    });
    sel.appendChild(grp);
  });
  checkReady();
}

function onFxChange(){
  const fx = document.getElementById('fx-select').value;
  document.getElementById('age-card').style.display = fx ? 'block' : 'none';
  updateBadge();
  checkReady();
}

function onAgeChange(){ updateBadge(); checkReady(); }

function updateBadge(){
  const fx = document.getElementById('fx-select').value;
  const age = parseInt(document.getElementById('age').value);
  const el = document.getElementById('proto-badge');
  if(!fx || isNaN(age)){ el.textContent = ''; return; }
  const hasPeds = DB[fx] && DB[fx].peds;
  const isAdult = age >= 16;
  if(!hasPeds || isAdult){
    el.innerHTML = '<span class="proto-adult">→ Adult protocol</span>';
  } else {
    el.innerHTML = '<span class="proto-peds">→ Paediatric protocol</span>';
  }
}

function checkReady(){
  const fx = document.getElementById('fx-select').value;
  const age = document.getElementById('age').value;
  document.getElementById('go-btn').disabled = !(fx && age);
}

function items(arr){
  if(!arr || !arr.length) return '';
  return arr.map(i => '<div class="item">' + i + '</div>').join('');
}

function showResult(){
  const fx = document.getElementById('fx-select').value;
  const age = parseInt(document.getElementById('age').value);
  const d = DB[fx];
  const isAdult = !d.peds || age >= 16;
  const r = isAdult ? d.adult : d.peds;
  const rc = REGION_CLASS[d.region] || '';

  let html = '';

  // Header
  html += '<div class="rhdr ' + rc + '">'
        + '<h2>' + fx + '</h2>'
        + '<p>AO ' + d.ao + ' &bull; ' + REGION_LABEL[d.region] + ' &bull; ' + (isAdult ? 'Adult' : 'Paediatric') + ' (' + age + 'y)</p>'
        + '</div>';

  // Absolute
  if(r.abs && r.abs.length){
    html += '<div class="section sec-red">'
          + '<div class="sec-title">🔴 Absolute Surgical Indications</div>'
          + items(r.abs)
          + '</div>';
  }

  // Relative (adult only)
  if(isAdult && r.rel && r.rel.length){
    html += '<div class="section sec-yellow">'
          + '<div class="sec-title">🟡 Relative Surgical Indications</div>'
          + items(r.rel)
          + '</div>';
  }

  // Conservative
  if(r.cons && r.cons.length){
    const consArr = Array.isArray(r.cons) ? r.cons : [r.cons];
    html += '<div class="section sec-green">'
          + '<div class="sec-title">🟢 Conservative Acceptable</div>'
          + items(consArr)
          + '</div>';
  }

  // Treatment
  html += '<div class="section sec-neutral">'
        + '<div class="sec-title">💊 Default Treatment</div>'
        + '<div style="font-size:13px;color:#cbd5e1;line-height:1.6">' + r.tx + '</div>'
        + '</div>';

  // Key points
  if(r.keys && r.keys.length){
    html += '<div class="section sec-neutral">'
          + '<div class="sec-title">💡 Key Points</div>'
          + items(r.keys)
          + '</div>';
  }

  // Evidence
  if(r.ev){
    html += '<div class="evidence">📚 ' + r.ev + '</div>';
  }

  document.getElementById('result-content').innerHTML = html;
  document.getElementById('form-view').style.display = 'none';
  document.getElementById('result-view').style.display = 'block';
  window.scrollTo(0,0);
}

function showForm(){
  document.getElementById('form-view').style.display = 'block';
  document.getElementById('result-view').style.display = 'none';
  window.scrollTo(0,0);
}

// Init
populateSelect();
</script>
</body>
</html>
